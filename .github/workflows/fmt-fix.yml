name: Apply rustfmt (temporary)

on:
  push:
    paths: ['.github/workflows/fmt-fix.yml']

permissions:
  contents: write

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0c1c5-clibo
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt
      - run: cargo fmt --manifest-path native/Cargo.toml
      - run: |
          git config user.name "clibo-fmt-bot"
          git config user.email "fmt-bot@localhost"
          git add -A
          git commit -m "Apply cargo fmt output" || echo "no changes"
          git push
